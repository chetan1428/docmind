name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: chetansatkar45/docmind

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Unit tests
        run: pytest -q

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: |
          helm lint helm/docmind --set image.tag=ci
          helm lint helm/docmind -f helm/docmind/values-dev.yaml --set image.tag=ci
          helm lint helm/docmind -f helm/docmind/values-prod.yaml --set image.tag=ci

  build-and-scan:
    needs: lint-and-test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docmind
          POSTGRES_PASSWORD: docmind
          POSTGRES_DB: docmind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docmind"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: docmind:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (real upload + question, offline LLM mode)
        env:
          DB: postgresql+psycopg://docmind:docmind@localhost:5432/docmind
          RD: redis://localhost:6379/0
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL="$DB" -e REDIS_URL="$RD" -e LLM_PROVIDER=extractive docmind:ci
          docker run -d --name worker --network host \
            -e DATABASE_URL="$DB" -e REDIS_URL="$RD" -e LLM_PROVIDER=extractive docmind:ci python -m app.worker

          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors localhost:8000/ready
          curl -fsS localhost:8000/health | grep -q '${{ github.sha }}'

          ID=$(curl -fsS -F file=@samples/kubernetes-basics.md localhost:8000/api/documents | jq -r .id)
          for _ in $(seq 1 30); do
            STATUS=$(curl -fsS localhost:8000/api/documents/"$ID" | jq -r .status)
            [ "$STATUS" = "ready" ] && break
            sleep 1
          done
          [ "$STATUS" = "ready" ]

          curl -fsS -X POST localhost:8000/api/ask \
            -H 'content-type: application/json' \
            -d '{"question":"What happens when a readiness probe fails?"}' | tee answer.json
          grep -q "readiness probe" answer.json

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs api || true
          docker logs worker || true

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: docmind:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  push:
    needs: build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
  deploy-aws:
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: aws
      url: ${{ vars.APP_URL }}
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
      ECR_REPO: 975739936766.dkr.ecr.ap-south-1.amazonaws.com/docmind
    steps:
      - name: Get AWS credentials via OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Who am I
        run: aws sts get-caller-identity

      - uses: docker/setup-buildx-action@v3

      - name: Copy image from Docker Hub to ECR
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPO%%/*}"
          docker buildx imagetools create -t "$ECR_REPO:$GITHUB_SHA" "chetansatkar45/docmind:$GITHUB_SHA"

      - name: Deploy with SSM Run Command
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=docmind-k3s" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ -z "$ID" ] || [ "$ID" = "None" ]; then
            echo "::error::EC2 instance docmind-k3s is not running - start it first"
            exit 1
          fi
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $GITHUB_SHA" \
            --parameters "commands=[\"rm -rf /opt/docmind && git clone https://github.com/$GITHUB_REPOSITORY.git /opt/docmind && cd /opt/docmind && git checkout $GITHUB_SHA && bash deploy/aws-deploy.sh $GITHUB_SHA\"]" \
            --query Command.CommandId --output text)
          echo "SSM command id: $CMD_ID"
          STATUS=Pending
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done
          echo "--- output ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" --query StandardOutputContent --output text | tail -20
          echo "Final status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "--- errors ---"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" --query StandardErrorContent --output text | tail -30
            exit 1
          fi

      - name: Verify the live site serves this commit
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS "${{ vars.APP_URL }}/health" | tee health.json | grep -q "$GITHUB_SHA"; then
              echo "Live: $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "::error::live site is not serving $GITHUB_SHA"
          exit 1
