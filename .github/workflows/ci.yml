name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: chetansatkar45/docmind

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Unit tests
        run: pytest -q

  build-and-scan:
    needs: lint-and-test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docmind
          POSTGRES_PASSWORD: docmind
          POSTGRES_DB: docmind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docmind"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: docmind:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (real upload + question, offline LLM mode)
        env:
          DB: postgresql+psycopg://docmind:docmind@localhost:5432/docmind
          RD: redis://localhost:6379/0
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=$DB -e REDIS_URL=$RD -e LLM_PROVIDER=extractive docmind:ci
          docker run -d --name worker --network host \
            -e DATABASE_URL=$DB -e REDIS_URL=$RD -e LLM_PROVIDER=extractive docmind:ci python -m app.worker

          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors localhost:8000/ready
          curl -fsS localhost:8000/health | grep -q '${{ github.sha }}'

          ID=$(curl -fsS -F file=@samples/kubernetes-basics.md localhost:8000/api/documents | jq -r .id)
          for i in $(seq 1 30); do
            STATUS=$(curl -fsS localhost:8000/api/documents/$ID | jq -r .status)
            [ "$STATUS" = "ready" ] && break
            sleep 1
          done
          [ "$STATUS" = "ready" ]

          curl -fsS -X POST localhost:8000/api/ask \
            -H 'content-type: application/json' \
            -d '{"question":"What happens when a readiness probe fails?"}' | tee answer.json
          grep -q "readiness probe" answer.json

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs api || true
          docker logs worker || true

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: docmind:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  push:
    needs: build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha