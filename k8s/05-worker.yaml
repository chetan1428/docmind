apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: docmind
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: worker
          image: chetansatkar45/docmind:3bde92a301f3c4e7380d519fe88bfb6482260ddb
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef:
                name: docmind-config
            - secretRef:
                name: docmind-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
